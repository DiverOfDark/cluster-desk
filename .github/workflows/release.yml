# Build packages on every push and pull request:
#   Linux: AppImage (x86_64)
#   Windows: zip (x86_64)
#   macOS: dmg with a universal (Apple Silicon + Intel) app bundle
# Pushes to main also publish them as a GitHub release, with latest.json and minisign
# signatures for the app's updater (src/update.rs).
name: release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

# A new push to a pull request cancels its older, still-running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VERSION: 0.1.${{ github.run_number }}
  # Built into the binary: the updater compares it with latest.json.
  CLUSTER_DESK_VERSION: 0.1.${{ github.run_number }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest available Ubuntu, so the AppImage runs on older glibc versions too.
          - os: ubuntu-22.04
            package: cluster-desk-linux-x86_64.AppImage
          - os: windows-latest
            package: cluster-desk-windows-x86_64.zip
          - os: macos-latest
            package: cluster-desk-macos-universal.dmg
            # What the updater downloads: the .app bundle on its own.
            update: cluster-desk-macos-universal.app.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - name: Linux AppImage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev librsvg2-bin
          cargo build --release --locked

          APPDIR=dist/AppDir
          ICONS="$APPDIR/usr/share/icons/hicolor"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" "$ICONS/scalable/apps"
          cp target/release/kubelens "$APPDIR/usr/bin/cluster-desk"
          cp assets/cluster-desk.desktop "$APPDIR/usr/share/applications/"
          cp assets/icon.svg "$ICONS/scalable/apps/cluster-desk.svg"
          for s in 16 24 32 48 64 128 256 512; do
            mkdir -p "$ICONS/${s}x${s}/apps"
            rsvg-convert -w $s -h $s assets/icon.svg -o "$ICONS/${s}x${s}/apps/cluster-desk.png"
          done
          cp assets/cluster-desk.desktop "$APPDIR/"
          cp "$ICONS/256x256/apps/cluster-desk.png" "$APPDIR/cluster-desk.png"
          # File managers show this as the AppImage's own icon.
          cp "$ICONS/256x256/apps/cluster-desk.png" "$APPDIR/.DirIcon"
          ln -s usr/bin/cluster-desk "$APPDIR/AppRun"

          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          # Runners have no FUSE; run the tool from its extracted contents.
          # appimagetool fails with relative paths, so pass absolute ones.
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool --no-appstream \
            "$PWD/$APPDIR" "$PWD/dist/${{ matrix.package }}"

      - name: Windows zip
        if: runner.os == 'Windows'
        run: |
          cargo build --release --locked
          mkdir -p dist/cluster-desk
          cp target/release/kubelens.exe dist/cluster-desk/cluster-desk.exe
          cp README.md dist/cluster-desk/
          cd dist && 7z a "${{ matrix.package }}" cluster-desk

      - name: macOS dmg
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

          APP="dist/dmg/Cluster Desk.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/cluster-desk" \
            target/aarch64-apple-darwin/release/kubelens \
            target/x86_64-apple-darwin/release/kubelens

          ICONSET=dist/AppIcon.iconset
          mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z $d $d assets/icon.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"

          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Cluster Desk</string>
            <key>CFBundleDisplayName</key><string>Cluster Desk</string>
            <key>CFBundleIdentifier</key><string>io.github.diverofdark.cluster-desk</string>
            <key>CFBundleExecutable</key><string>cluster-desk</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          # Not signed with a developer certificate; an ad-hoc signature keeps Apple Silicon happy.
          codesign --force --deep --sign - "$APP"

          tar -czf "dist/${{ matrix.update }}" -C dist/dmg "Cluster Desk.app"
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Cluster Desk" -srcfolder dist/dmg -ov -format UDZO "dist/${{ matrix.package }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: |
            dist/${{ matrix.package }}
            ${{ matrix.update && format('dist/{0}', matrix.update) || '' }}
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Each package the updater installs is signed with a trusted comment naming its version
      # and platform; latest.json lists them. The app checks both against its built-in key.
      - name: Sign for the updater
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          entries=""
          for pair in linux-x86_64:cluster-desk-linux-x86_64.AppImage \
                      windows-x86_64:cluster-desk-windows-x86_64.zip \
                      macos:cluster-desk-macos-universal.app.tar.gz; do
            platform="${pair%%:*}" file="${pair#*:}"
            minisign -S -s "$RUNNER_TEMP/minisign.key" -m "dist/$file" -t "cluster-desk $VERSION $platform" </dev/null
            entries="$entries$(jq -n --arg p "$platform" --arg url "$base/$file" --rawfile sig "dist/$file.minisig" \
              '{($p): {url: $url, signature: $sig}}')"
          done
          rm -f "$RUNNER_TEMP/minisign.key"
          echo "$entries" | jq -s --arg v "$VERSION" '{version: $v, platforms: add}' > dist/latest.json
          cat dist/latest.json

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cluster Desk v$VERSION" \
            --notes "Automatic build of ${GITHUB_SHA::7} from main." \
            --target "$GITHUB_SHA"
