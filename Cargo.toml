[package]
name = "kubelens"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.37"
egui_extras = "0.37"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
serde_yaml = "0.9"
portable-pty = "0.9.0"
vt100 = "0.18.1"
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
ureq = "2"
sha2 = "0.11.1"
flate2 = "1.1.10"
tar = "0.4.46"
serde = { version = "1.0.229", features = ["derive"] }
egui_kittest = { version = "0.37", features = ["wgpu", "eframe"] }
egui_system_font_provider = "0.37.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
