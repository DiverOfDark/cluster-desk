# Build a Linux release on every commit to the default branch (main) and publish it as a
# GitLab release with the binary in the generic package registry.
stages:
  - build
  - release

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_TERM_COLOR: always
  VERSION: "0.1.$CI_PIPELINE_IID"
  PACKAGE_URL: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/cluster-desk/0.1.$CI_PIPELINE_IID/cluster-desk-linux-x86_64.tar.gz"

build-linux:
  stage: build
  image: rust:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  cache:
    key: cargo-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/registry
      - .cargo/git
      - target
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev curl
  script:
    - cargo build --release --locked
    - mkdir -p dist/cluster-desk
    - cp target/release/kubelens dist/cluster-desk/cluster-desk
    - cp README.md dist/cluster-desk/
    - tar -czf dist/cluster-desk-linux-x86_64.tar.gz -C dist cluster-desk
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file dist/cluster-desk-linux-x86_64.tar.gz "$PACKAGE_URL"'
  artifacts:
    paths:
      - dist/cluster-desk-linux-x86_64.tar.gz
    expire_in: 1 week

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [build-linux]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "Releasing v$VERSION"
  release:
    tag_name: "v$VERSION"
    name: "Cluster Desk v$VERSION"
    description: "Automatic build of $CI_COMMIT_SHORT_SHA from main."
    ref: "$CI_COMMIT_SHA"
    assets:
      links:
        - name: cluster-desk-linux-x86_64.tar.gz
          url: "$PACKAGE_URL"
          link_type: package
